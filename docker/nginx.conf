# Lets /predictor-api/ carry the live-log WebSocket as well as plain requests.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  # Preserve the public host/port when accessed through Docker or a reverse proxy.
  absolute_redirect off;

  client_max_body_size 8m;
  add_header Referrer-Policy "no-referrer" always;
  # Account links carry one-use tokens; do not persist query strings in access logs.
  access_log off;
  root /usr/share/nginx/html;
  index index.html;

  location = /console/index.html { return 302 /communities; }
  location = /console/ { return 302 /communities; }
  location = /console { return 302 /communities; }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /_jobs_auth {
    internal;
    proxy_pass ${COMMUNITY_API_URL}/api/identity/gateway-check?service=jobs;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-EnergAIze-Service "";
  }
  location /jobs-api/ {
    auth_request /_jobs_auth;
    proxy_pass ${JOBS_API_URL}/;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 2g;
    proxy_set_header X-EnergAIze-Service "";
  }

  location = /_training_auth {
    internal;
    proxy_pass ${COMMUNITY_API_URL}/api/identity/gateway-check?service=training;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-EnergAIze-Service "";
  }
  location /training-api/ {
    auth_request /_training_auth;
    proxy_pass ${TRAINING_API_URL}/;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 2g;
    proxy_set_header X-EnergAIze-Service "";
  }

  location = /_predictor_auth {
    internal;
    proxy_pass ${COMMUNITY_API_URL}/api/identity/gateway-check?service=predictor;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-EnergAIze-Service "";
  }
  # Revalidate long-lived log subscriptions after logout/erasure too.
  location = /predictor-api/ws/logs {
    proxy_pass ${COMMUNITY_API_URL}/api/identity/predictor-stream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-EnergAIze-Service "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location /predictor-api/ {
    auth_request /_predictor_auth;
    proxy_pass ${PREDICTOR_API_URL}/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 2g;
    proxy_set_header X-EnergAIze-Service "";
  }

  location = /_kpi_auth {
    internal;
    proxy_pass ${COMMUNITY_API_URL}/api/identity/gateway-check?service=kpi;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-EnergAIze-Service "";
  }
  location /kpi-api/ {
    auth_request /_kpi_auth;
    proxy_pass ${KPI_API_URL}/;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 2g;
    proxy_set_header X-EnergAIze-Service "";
  }

  location /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Legacy measurements are intentionally retired; current charts use Telemetry.
  location /measurement-api/ { return 410; }

  location /ai-training-api/ {
    proxy_set_header X-EnergAIze-Service "";
    proxy_pass ${AI_TRAINING_API_URL}/;
    proxy_read_timeout 180s;
    client_max_body_size 500m;
    proxy_set_header Host $host;
  }

  location /runtime-api/ {
    proxy_pass ${RUNTIME_API_URL}/;
    proxy_buffering off;
    proxy_read_timeout 90s;
    client_max_body_size 250m;
    proxy_set_header X-EnergAIze-Service "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /community-api/ {
    proxy_pass ${COMMUNITY_API_URL}/;
    proxy_set_header X-EnergAIze-Service "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /access-api/ {
    proxy_pass ${ACCESS_API_URL}/;
    proxy_set_header X-EnergAIze-Service "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /telemetry-api/ {
    proxy_pass ${TELEMETRY_API_URL}/;
    proxy_set_header X-EnergAIze-Service "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Worker coordination is available only on the internal backend network.
  location ^~ /flexibility-api/api/internal/ { return 404; }

  location /flexibility-api/ {
    proxy_pass ${FLEXIBILITY_API_URL}/;
    proxy_set_header X-EnergAIze-Service "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
