server {
  listen 80;
  listen [::]:80;
  server_name _;
  # Preserve the public host/port when accessed through Docker or a reverse proxy.
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  location = /console/index.html { return 302 /communities; }
  location = /console/ { return 302 /communities; }
  location = /console { return 302 /communities; }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /measurement-api/ {
    proxy_pass http://193.136.62.78:8000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }

  location /community-api/ {
    proxy_pass ${COMMUNITY_API_URL}/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /access-api/ {
    proxy_pass ${ACCESS_API_URL}/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /telemetry-api/ {
    proxy_pass ${TELEMETRY_API_URL}/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /flexibility-api/ {
    proxy_pass ${FLEXIBILITY_API_URL}/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
